name: verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Framework gate
        run: bash _meta/verify.sh
      - name: Project gate, exercised against synthetic projects
        # The framework gate says the framework is consistent. It says nothing about whether
        # the gate projects will run actually works — that one has to be exercised.
        run: bash _meta/test-project-gate.sh
      - name: Claude Code adapter hooks and scaffold, exercised against a synthetic project
        run: bash adapters/claude-code/test-hooks.sh
