name: release
on:
  push:
    tags: ['v*']
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Framework gate
        run: bash _meta/verify.sh
      - name: The tag is the declared version (the canonical number lives in _meta/VERSION.md)
        run: |
          v=$(grep -oE 'Current version: [0-9.]+' _meta/VERSION.md | grep -oE '[0-9.]+$')
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "✗ tag $GITHUB_REF_NAME ≠ Current version $v in _meta/VERSION.md"; exit 1; }
          echo "✓ tag $GITHUB_REF_NAME = declared version"
      - name: Record where the copy came from (_meta/ORIGIN — only exists in copies)
        run: |
          # This is where a project reads the upstream repository (W00 step 6, verify-project.sh
          # check 8) instead of asking someone who "may not be technical" where a ZIP came from.
          # It goes into the manifest and into the ZIP.
          printf 'repository=%s\ntag=%s\nzip=Maestro-%s.zip\n' "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$GITHUB_REF_NAME" > _meta/ORIGIN
          cat _meta/ORIGIN
      - name: Build the integrity manifest (_meta/SHA256SUMS)
        run: |
          : > _meta/SHA256SUMS
          while IFS= read -r f; do
            f=${f#./}
            case "$f" in .git/*|.github/*|_meta/SHA256SUMS) continue ;; esac
            excl=0
            while IFS= read -r l; do
              case "$l" in ''|'#'*) continue ;; esac
              # glob match — the SAME semantics the zip exclusion uses below, so a pattern
              # entry can never be excluded from the ZIP yet still hashed into the manifest
              # (which would fail --integrity in every copy).
              case "$f" in $l) excl=1 ;; esac
            done < _meta/DO-NOT-DISTRIBUTE
            [ "$excl" = 1 ] && continue
            sha256sum "$f" >> _meta/SHA256SUMS
          done < <(find . -type f | sort)
          wc -l _meta/SHA256SUMS
      - name: Build the sanitized ZIP (excludes .git, .github and _meta/DO-NOT-DISTRIBUTE)
        run: |
          EX=(-x '.git/*' -x '.github/*')
          while IFS= read -r l; do
            case "$l" in ''|'#'*) continue ;; esac
            EX+=(-x "$l")
          done < _meta/DO-NOT-DISTRIBUTE
          zip -qr "Maestro-${GITHUB_REF_NAME}.zip" . "${EX[@]}"
          unzip -l "Maestro-${GITHUB_REF_NAME}.zip" | tail -3
      - name: Gate the DISTRIBUTED artifact (what projects actually copy)
        run: |
          # The gate above ran on the full checkout, BEFORE any exclusion. This one runs
          # inside the extracted ZIP — the only thing that proves a copy works on day one.
          # A self-excluding DO-NOT-DISTRIBUTE entry once shipped a release whose own gate
          # failed on extraction; CI was green throughout. Never again.
          rm -rf /tmp/relcheck && mkdir -p /tmp/relcheck
          unzip -q "Maestro-${GITHUB_REF_NAME}.zip" -d /tmp/relcheck
          for l in $(grep -vE '^\s*(#|$)' _meta/DO-NOT-DISTRIBUTE); do
            if compgen -G "/tmp/relcheck/$l" > /dev/null; then
              echo "✗ CONFIDENTIALITY: $l leaked into the distributed ZIP"; exit 1
            fi
          done
          echo "✓ no DO-NOT-DISTRIBUTE entry present in the ZIP"
          ( cd /tmp/relcheck && bash _meta/verify.sh )
          ( cd /tmp/relcheck && bash _meta/verify.sh --integrity )
          # The forbidden-terms sweep runs on the checkout (the "Framework gate" step), but
          # _meta/FORBIDDEN-TERMS does not travel in the ZIP — so check 14 reports "not
          # applicable" in there. Repeat it here, with the checkout's list, against the tree
          # projects actually receive: the last point where a real name can still be stopped.
          # Case-insensitive (the case-sensitive version let 15 occurrences of one term travel),
          # sweeps file NAMES too, and never prints the term or the line — CI logs get read too.
          if [ -f _meta/FORBIDDEN-TERMS ]; then
            fuga=0; i=0
            while IFS= read -r termo; do
              i=$((i + 1)); case "$termo" in ''|'#'*) continue ;; esac
              if grep -rniE -e "$termo" /tmp/relcheck >/dev/null 2>&1; then
                echo "✗ CONFIDENTIALITY: forbidden term no. $i in the list present in the distributed ZIP (folders):"
                grep -rliE -e "$termo" /tmp/relcheck | xargs -n1 dirname | sort -u | head -5
                fuga=1
              fi
              if find /tmp/relcheck -type f | grep -iE -e "$termo" >/dev/null 2>&1; then
                echo "✗ CONFIDENTIALITY: forbidden term no. $i in the list in a FILE NAME in the ZIP"
                fuga=1
              fi
            done < _meta/FORBIDDEN-TERMS
            [ "$fuga" = 0 ] || exit 1
            echo "✓ forbidden-terms sweep: no real name inside the ZIP"
          fi
      - name: Project gate, exercised from the extracted ZIP
        run: |
          # The gate projects will run is the one INSIDE the copy. Proving it on the checkout
          # proves nothing about the artifact — the same lesson that created the step above.
          bash /tmp/relcheck/_meta/test-project-gate.sh /tmp/relcheck
      - name: Claude Code adapter hooks and scaffold, exercised from the extracted ZIP
        run: bash /tmp/relcheck/adapters/claude-code/test-hooks.sh /tmp/relcheck
      - name: Publish the release with the ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The SHA-256 in the notes proves the downloaded ZIP is the published one (download
          # integrity); the internal manifest proves the copy is self-consistent. Neither is
          # signed provenance — that would require artifact attestation (START-HERE.md Part 1).
          SHA=$(sha256sum "Maestro-${GITHUB_REF_NAME}.zip" | cut -d' ' -f1)
          gh release create "${GITHUB_REF_NAME}" "Maestro-${GITHUB_REF_NAME}.zip" \
            --title "Maestro ${GITHUB_REF_NAME}" \
            --notes "Sanitized framework copy for projects — see _meta/VERSION.md for the changelog. Bootstrap instructions: START-HERE.md. ZIP SHA-256: ${SHA}"
